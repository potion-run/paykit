# paykit-polar depends on paykit at runtime, and paykit dev-depends on
# paykit-polar for its adapter tests. The cycle is deliberate: each package
# builds on its own, so arbitrary task order is correct.
ignoreWorkspaceCycles: true

packages:
  - packages/*
  - examples/*
  - website

# Postinstall scripts from dependencies. `workerd` ships the emulated
# Cloudflare runtime the stores and tests run against; Blume's Astro build needs
# esbuild's platform check; `@scarf/scarf` is a transitive telemetry hook Blume
# does not need.
allowBuilds:
  esbuild: true
  # quint depends on protobufjs; its postinstall only wires the protobufjs CLI,
  # which no gate here runs.
  protobufjs: false
  sharp: false
  workerd: true
  "@scarf/scarf": false

# One version per dependency for the whole scope. A package that needs a
# different line pins it locally and says why.
catalog:
  "@alchemy.run/cloudflare": "2.0.0-beta.85"
  "@alchemy.run/better-auth": "2.0.0-beta.85"
  "@alchemy.run/domain": "2.0.0-beta.85"
  "@alchemy.run/sql": "2.0.0-beta.85"
  "@alchemy.run/stripe": "2.0.0-beta.85"
  "@alchemy.run/test": "2.0.0-beta.85"
  "@distilled.cloud/core": "1.0.0-rc.18"
  "@distilled.cloud/polar": "1.0.0-rc.18"
  "@distilled.cloud/stripe": "1.0.0-rc.18"
  "@effect/atom-react": "4.1.2"
  "@effect/platform-node": "^4.1.2"
  "@effect/sql-mysql2": "^4.1.0"
  "@effect/sql-pg": "^4.1.0"
  # The Effect LSP's Oxlint integration. Pinned exactly: `effect-tsgo patch`
  # rewrites the installed `oxlint` and `oxlint-tsgolint` binaries, and a release
  # only supports the tool versions its README table names.
  "@effect/tsgo": "0.67.1"
  # Foldkit's UI components and DevTools overlay ship on the framework's
  # version line; keep them in step with `foldkit`.
  "@foldkit/devtools": "^0.170.0"
  "@foldkit/ui": "^0.170.0"
  "@foldkit/vite-plugin": "^0.29.0"
  # The Quint CLI checks the models under `specs/`. It is a dev-only tool: the
  # specs are not published, so nothing in `packages/*` depends on it.
  "@informalsystems/quint": "0.33.1"
  "@tanstack/react-router": "^1.170.46"
  "@tanstack/react-start": "^1.169.4"
  "@types/bun": "1.4.4"
  "@types/node": "26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.2"
  alchemy: "2.0.0-beta.85"
  blume: "^2.2.6"
  better-auth: "^1.7.5"
  effect: "^4.1.2"
  foldkit: "^0.170.0"
  husky: "^9.1.7"
  # The host package for the vendored anti-slop Oxlint plugins. Pinned exactly
  # to the installed `oxlint`: the two are one API, so they move together.
  "@oxlint/plugins": "1.91.0"
  "@types/pg": "^8.20.0"
  oxfmt: "^0.76.0"
  mysql2: "^3.24.2"
  drizzle-orm: "1.0.0-rc.5"
  pg: "^8.22.0"
  oxlint: "^1.91.0"
  oxlint-tsgolint: "7.0.2005"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  scheduler: "^0.28.0"
  tsrs: "0.21.0-ts7.1.0-beta"
  typescript: "^7.0.2"
  vite: "^8.3.1"

