permissions:
  "@alchemy.run/domain":
    skills: true

# Recursive `pnpm -r run` graph. Builds are never triggered by install.
tasks:
  build:package:
    dependsOn:
      - ^build:package
  typecheck:
    dependsOn: []
  test:
    dependsOn: []
